# Render Blueprint. Paid service + persistent disk; review costs before deployment.
services:
  - type: web
    name: mcq-web
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn backend.main:app --host 0.0.0.0 --port 10000 --workers 1
    healthCheckPath: /api/config
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "10000"
      - key: MCQ_DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "true"
      - key: OCR_DAILY_LIMIT
        value: "50"
      - key: MCQ_ACCESS_CODE
        generateValue: true
    disk:
      name: mcq-data
      mountPath: /data
      sizeGB: 1
